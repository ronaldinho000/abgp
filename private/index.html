    html, body { min-height:100%; }

    .shell { width:min(1280px, calc(100% - 28px)); min-height:100vh; margin:0 auto; padding:22px 0 26px; display:flex; flex-direction:column; gap:14px; }
    .card { background:rgba(255,255,255,.86); border:1px solid rgba(222,222,229,.88); border-radius:24px; padding:18px; box-shadow:var(--shadow); backdrop-filter: blur(14px); }

    h1 { margin:0; font-size:clamp(30px, 4vw, 52px); line-height:1.02; letter-spacing:-1.8px; }
    p { margin:8px 0 0; color:var(--muted); line-height:1.55; }
    .badge { display:inline-flex; align-items:center; min-height:28px; padding:6px 10px; border-radius:999px; font-size:12px; font-weight:900; white-space:nowrap; background:rgba(113,50,245,.11); color:var(--purple); }
    .login { max-width:560px; margin:7vh auto 0; width:100%; }
    label { display:block; font-size:13px; font-weight:900; margin:18px 0 8px; }
    input { width:100%; min-height:48px; border:1px solid var(--line); border-radius:14px; padding:0 14px; font-size:17px; outline:none; background:#fff; }
    input:focus { border-color:rgba(113,50,245,.62); box-shadow:0 0 0 4px rgba(113,50,245,.12); }
    button { appearance:none; border:0; border-radius:14px; min-height:46px; padding:0 16px; font-weight:900; cursor:pointer; }
    .primary { width:100%; margin-top:14px; color:white; background:linear-gradient(135deg,var(--purple),var(--purple2)); box-shadow:0 14px 34px rgba(113,50,245,.22); }
    .msg { min-height:22px; margin-top:12px; font-size:13px; color:var(--muted); }
    .msg.error { color:var(--danger); }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
    .entry-btn { border:1px solid rgba(222,222,229,.95); background:#fff; color:var(--ink); border-radius:16px; min-height:58px; padding:12px 14px; text-align:left; box-shadow:0 10px 30px rgba(0,0,0,.035); }
    .entry-btn.active { color:#fff; border-color:transparent; background:linear-gradient(135deg,var(--purple),var(--purple2)); }
    .viewer-card { flex:1; min-height:0; background:var(--surface); border:1px solid rgba(222,222,229,.88); border-radius:24px; box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column; }
    .viewer-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 14px; border-bottom:1px solid rgba(222,222,229,.76); background:linear-gradient(180deg,#fff,#fbfbff); }
    #currentTitle { font-weight:900; }
    iframe { width:100%; min-height:76vh; flex:1; border:0; background:#fff; }
    .hint { font-size:12px; color:var(--muted); }
    .hidden { display:none !important; }
    @media (max-width:780px) { header { flex-direction:column; } .actions { display:grid; grid-template-columns:1fr; } iframe { min-height:72vh; } .viewer-head { align-items:flex-start; flex-direction:column; } }

    const enc = new TextEncoder();
    const dec = new TextDecoder();
    const loginCard = document.getElementById('loginCard');
    const appCard = document.getElementById('appCard');
    const viewerCard = document.getElementById('viewerCard');
    const form = document.getElementById('unlockForm');
    const passwordInput = document.getElementById('password');

    function b64ToBytes(value) {
      const binary = atob(value);
      const out = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
      return out;
    }

    function stripPublishedPrivateRoute(value) {
      if (value.startsWith('/private/')) return value.slice('/private/'.length);
      const projectPagesMatch = value.match(new RegExp('^/[^/]+/private/(.+)$'));
      if (projectPagesMatch) return projectPagesMatch[1];
      return value;
    }

    function normalizePath(input) {
      let value = String(input || '');
      try { if (value.startsWith('http')) value = new URL(value).pathname; } catch (_) {}
      value = value.split('?')[0].split('#')[0];
      value = stripPublishedPrivateRoute(value);
      if (value.startsWith('./')) value = value.slice(2);
      while (value.startsWith('/')) value = value.slice(1);
      while (value.includes('../')) value = value.replace('../', '');
      if (!value || value === '.') value = 'index.html';
      return value;
    }

    function fileBytes(file) {
      if (file.encoding === 'base64') return b64ToBytes(file.content);
      return enc.encode(file.content || '');
    }

    function fileText(path) {
      const file = window.__ABGP_PRIVATE_FILES?.[normalizePath(path)];
      if (!file) return '';
      if (file.encoding === 'base64') return dec.decode(b64ToBytes(file.content));
      return file.content || '';
    }

    function responseForFile(path) {
      const key = normalizePath(path);
      const file = window.__ABGP_PRIVATE_FILES?.[key];
      if (!file) return new Response('Not found', { status: 404 });
      const body = file.encoding === 'base64' ? fileBytes(file) : (file.content || '');
      return new Response(body, { status: 200, headers: { 'Content-Type': file.mime || 'application/octet-stream', 'Cache-Control': 'no-store' } });
    }

    function displayHtml(path, html) {
      const shim = "<script>\n(function(){\n  const originalFetch = window.fetch.bind(window);\n  function stripPublishedPrivateRoute(value) {\n    if (value.startsWith('/private/')) return value.slice('/private/'.length);\n    const projectPagesMatch = value.match(new RegExp('^/[^/]+/private/(.+)$'));\n    if (projectPagesMatch) return projectPagesMatch[1];\n    return value;\n  }\n  function normalizePath(input) {\n    let value = String(input || '');\n    try { if (value.startsWith('http')) value = new URL(value).pathname; } catch (_) {}\n    value = value.split('?')[0].split('#')[0];\n    value = stripPublishedPrivateRoute(value);\n    if (value.startsWith('./')) value = value.slice(2);\n    while (value.startsWith('/')) value = value.slice(1);\n    while (value.includes('../')) value = value.replace('../', '');\n    if (!value || value === '.') value = 'index.html';\n    return value;\n  }\n  window.fetch = async function(input, init) {\n    const key = normalizePath(input && input.url ? input.url : input);\n    if (parent.__ABGP_PRIVATE_FILES && parent.__ABGP_PRIVATE_FILES[key]) return parent.__ABGP_RESPONSE_FOR_FILE(key);\n    return originalFetch(input, init);\n  };\n  document.addEventListener('click', function(event) {\n    const a = event.target.closest && event.target.closest('a[href]');\n    if (!a) return;\n    const key = normalizePath(a.getAttribute('href'));\n    if (parent.__ABGP_PRIVATE_FILES && parent.__ABGP_PRIVATE_FILES[key] && key.endsWith('.html')) {\n      event.preventDefault();\n      parent.__ABGP_OPEN_PAGE(key);\n    }\n  }, true);\n})();\n<\/script>";
      const prepared = html
        .replaceAll('Private Local · 禁止公开部署', 'Private Encrypted · 密码访问')
        .replaceAll('Private Local', 'Private Encrypted')
        .replaceAll('当前只适合内部局域网/本机访问，不公开部署。', '当前通过加密静态页面外网访问，解锁后仅在浏览器内显示。');
      if (prepared.includes('<script>')) return prepared.replace('<script>', () => shim + '\n<script>');
      return prepared.replace('</body>', () => shim + '\n</body>');
    }

    function openPage(path, title) {
      const key = normalizePath(path);
      const file = window.__ABGP_PRIVATE_FILES?.[key];
      if (!file) {
        message.textContent = '找不到页面：' + key;
        message.className = 'msg error';
        return;
      }
      const html = file.encoding === 'base64' ? dec.decode(fileBytes(file)) : file.content;
      viewer.srcdoc = displayHtml(key, html || '');
      currentTitle.textContent = title || (key === 'chart.html' ? 'BTCUSDT 多周期 K线 / 复盘' : '项目私密看板');
      document.querySelectorAll('.entry-btn').forEach(btn => btn.classList.toggle('active', normalizePath(btn.dataset.path) === key));
    }

    async function decryptBundle(password) {
      const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64ToBytes(ENCRYPTED_BUNDLE.salt_b64), iterations: ENCRYPTED_BUNDLE.iterations, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      const plaintext = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: b64ToBytes(ENCRYPTED_BUNDLE.iv_b64) },
        key,
        b64ToBytes(ENCRYPTED_BUNDLE.ciphertext_b64)
      );
      return JSON.parse(dec.decode(plaintext));
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const password = passwordInput.value;
      if (!password) return;
      unlockButton.disabled = true;
      unlockButton.textContent = '正在解锁...';
      message.textContent = '正在派生密钥并解密，请稍候...';
      message.className = 'msg';
      try {
        const bundle = await decryptBundle(password);
        window.__ABGP_PRIVATE_FILES = bundle.files || {};
        window.__ABGP_RESPONSE_FOR_FILE = responseForFile;
        window.__ABGP_FILE_TEXT = fileText;
        window.__ABGP_OPEN_PAGE = openPage;
        loginCard.classList.add('hidden');
        appCard.classList.remove('hidden');
        viewerCard.classList.remove('hidden');
        openPage('index.html', '项目私密看板');
        passwordInput.value = '';
      } catch (err) {
        message.textContent = '密码错误或加密包损坏，未加载私密内容。';
        message.className = 'msg error';
      } finally {
        unlockButton.disabled = false;
        unlockButton.textContent = '解锁私密看板';
      }
    });

    document.querySelectorAll('.entry-btn').forEach(button => {
      button.addEventListener('click', () => openPage(button.dataset.path, button.dataset.title));
    });
  </script>
</body>
</html>
